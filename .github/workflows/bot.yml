name: memebot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memebot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          RUN_MINUTES: "13"
        run: python memebot.py
      - name: Save results
        run: |
          git config user.name "memebot"
          git config user.email "memebot@users.noreply.github.com"
          git add state.json || true
          git add trades.csv || true
          git commit -m "bot update" || echo "nothing new"
          git push
